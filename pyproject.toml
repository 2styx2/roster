[project]
name = "roster"
version = "0.7.0"
description = "Give a box - and Claude running on it - access to every host on your network, from one YAML file."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "pyyaml>=6.0",
    "paramiko>=3.4",
    "pydantic>=2",
]

[project.scripts]
roster = "roster.cli:main"
# ssh's askpass helpers on Windows, where ssh runs only a program as SSH_ASKPASS (roster/askpass.py); Linux and
# macOS use a script serve writes, and these do nothing when ssh didn't start them
roster-askpass = "roster.askpass:main"
roster-askpass-login = "roster.askpass:logged_in_main"

[dependency-groups]
dev = [
    "pyright[nodejs]==1.1.414",
    "pytest>=8.0",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roster"]

# roster(1) also lands in PREFIX/share/man/man1 when pip or uv installs the wheel into a prefix, next to
# PREFIX/bin/roster, so man finds it. `uv tool install` keeps it in the tool's venv: `roster help --man --install`.
[tool.hatch.build.targets.wheel.shared-data]
"src/roster/roster.1" = "share/man/man1/roster.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# pytest-timeout (#234): a test that hangs fails after 2 minutes, with every thread's stack, instead of
# running on to the CI job's limit. The slowest test takes about 30 s on the Windows runner (a Mesh run
# against stand-in Hosts under Git for Windows' sh, 2026-11-02) and under 7 s on Linux.
timeout = 120

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# S: flake8-bandit's security rules (T112). Each finding is fixed or carries a noqa with its reason, except:
#   S603, S607: roster's job is running ssh, git, nmap and the vault CLIs found on PATH, always as an argv list
#   (never a shell; common.program_argv refuses what cmd.exe would act on), so every call would be a noqa.
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["E501", "B904", "UP031", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
# pytest's asserts; made-up passwords and temp paths for the stand-in vaults and Hosts
"tests/**" = ["S101", "S105", "S106", "S108"]

# The type checker (T112, decision Q113): basic over the CLI, strict for each module that is new or rewritten from
# T112 on (add it to `strict`). `uv run pyright`; CI runs it beside ruff.
[tool.pyright]
include = ["src/roster"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
strict = ["src/roster/models.py", "src/roster/completion.py", "src/roster/inventories.py", "src/roster/servemodels.py", "src/roster/jsondocs.py",
          "src/roster/jsonout.py",
          "src/roster/authorized.py",
          "src/roster/boxsetup.py",
          "src/roster/catchup.py",
          "src/roster/cliparser.py",
          "src/roster/context.py",
          "src/roster/hosts.py",
          "src/roster/keyline.py",
          "src/roster/named.py",
          "src/roster/providers/problems.py",
          "src/roster/revoke.py",
          "src/roster/rotate.py",
          "src/roster/sshconfig.py",
          "src/roster/vaultcli.py"]
