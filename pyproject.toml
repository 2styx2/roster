[project]
name = "roster"
version = "0.4.0"
description = "Give a box - and Claude running on it - access to every host on your network, from one YAML file."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "pyyaml>=6.0",
    "paramiko>=3.4",
]

[project.scripts]
roster = "roster.cli:main"
# ssh's askpass helpers on Windows, where ssh runs only a program as SSH_ASKPASS (roster/askpass.py); Linux and
# macOS use a script serve writes, and these do nothing when ssh didn't start them
roster-askpass = "roster.askpass:main"
roster-askpass-login = "roster.askpass:logged_in_main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roster"]

# roster(1) also lands in PREFIX/share/man/man1 when pip or uv installs the wheel into a prefix, next to
# PREFIX/bin/roster, so man finds it. `uv tool install` keeps it in the tool's venv: `roster man --install`.
[tool.hatch.build.targets.wheel.shared-data]
"src/roster/roster.1" = "share/man/man1/roster.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# pytest-timeout (#234): a test that hangs fails after 2 minutes, with every thread's stack, instead of
# running on to the CI job's limit. The slowest test takes about 30 s on the Windows runner (a Mesh run
# against stand-in Hosts under Git for Windows' sh, 2026-11-02) and under 7 s on Linux.
timeout = 120

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B904", "UP031"]
