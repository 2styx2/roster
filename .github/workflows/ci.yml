name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: sh scripts/line-budget.sh
      - name: make install and uninstall
        run: |
          p="$RUNNER_TEMP/prefix"
          make install PREFIX="$p"
          test -x "$p/bin/roster" && "$p/bin/roster" --version
          test -f "$p/share/bash-completion/completions/roster"
          test -f "$p/share/man/man1/roster.1"
          make uninstall PREFIX="$p"
          test -z "$(find "$p" -type f)"

  side-by-side:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: ROSTER_SIDE_BY_SIDE=1 cargo test --locked --test side_by_side -- --ignored

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
