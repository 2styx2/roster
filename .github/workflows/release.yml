# roster Release: build the app and the CLI for every platform, then put them on a draft GitHub Release.
#
#   push a tag vX.Y.Z (on main)  build everything, write SHA256SUMS, and create a DRAFT Release with all of it;
#                                the maintainer checks it and publishes it (docs/releasing.md)
#   workflow_dispatch            the same builds, uploaded as workflow artifacts only: no Release, no tag
#   pull_request touching this   the same builds, as a dry run, so a broken release pipeline shows up
#   file, its scripts or the     before a tag needs it (docs.yml builds the docs PDF on every PR)
#   bundle config
#
# One version for everything (scripts/bump-version.sh); a tag whose version differs from the files fails first.
# No code signing yet: Windows SmartScreen and macOS Gatekeeper warn (docs/releasing.md says how to add it).
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/bump-version.sh
      - scripts/news_section.py
      - scripts/check-release-notices.py
      - app/src-tauri/tauri.conf.json

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  UV_VERSION: "0.12.23"
  UV_PYTHON_DOWNLOADS: "never"
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Every file has one version (and it's the tag's)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v=$(scripts/bump-version.sh --check "${GITHUB_REF_NAME#v}")
          else
            v=$(scripts/bump-version.sh --check)
          fi
          # A tag's Release notes start with its docs/news.md section: fail now, not after the builds.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then python3 -I scripts/news_section.py "$v" > /dev/null; fi
          # Every installer carries LICENSE and THIRD-PARTY-NOTICES (bundle.resources): fail before the builds.
          python3 -I scripts/check-release-notices.py --config app/src-tauri/tauri.conf.json
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version $v" >> "$GITHUB_STEP_SUMMARY"

  cli:
    name: CLI (wheel, sdist, source tarball)
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      # roster(1) is generated from the parser and docs/cli-reference.md and committed; never ship a stale one.
      - run: uv run --python python3.12 python -m roster.manpage --check
      - run: uv build --python python3.12 --out-dir out
      # The CLI's own files with install.sh, for boxes without git: unpack and run ./install.sh in it.
      # Laid out like a prefix for the man page too (share/man/man1/roster.1), as Neovim's tarballs are.
      - name: roster-cli tarball
        run: |
          files=(pyproject.toml uv.lock .python-version README.md install.sh src examples
                 docs/cli-reference.md docs/serve-api.md docs/new-box.md docs/adding-hosts.md)
          [ -f LICENSE ] && files+=(LICENSE)
          d="roster-cli-$VERSION"
          mkdir -p stage
          git archive --format=tar --prefix="$d/" HEAD "${files[@]}" | tar -x -C stage
          mkdir -p "stage/$d/share/man/man1" && cp src/roster/roster.1 "stage/$d/share/man/man1/roster.1"
          tar -czf "out/$d.tar.gz" -C stage "$d"
      # The man page on its own, for packagers.
      - run: cp src/roster/roster.1 out/roster.1
      - run: ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: release-cli
          path: out/*
          if-no-files-found: error
          retention-days: 14

  app:
    name: App (${{ matrix.name }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            args: ""
            target_dir: target/release
          - name: linux-x64
            os: ubuntu-22.04
            args: "--bundles appimage,deb"
            target_dir: target/release
          # Both Mac architectures in one app. Ad-hoc signed (app/src-tauri/tauri.macos.conf.json), not
          # notarized: see docs/releasing.md.
          - name: macos-universal
            os: macos-latest
            args: "--target universal-apple-darwin"
            target_dir: target/universal-apple-darwin/release
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install the Tauri system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev patchelf file pkg-config build-essential
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}
      - run: npm ci
        working-directory: app
      - name: tauri build
        working-directory: app
        run: npm run tauri build -- ${{ matrix.args }}

      # Same names on every platform: roster-app-<version>-<platform>.<ext>.
      - name: Collect (Windows)
        if: runner.os == 'Windows'
        run: |
          d="${{ matrix.target_dir }}"; p="roster-app-$VERSION-${{ matrix.name }}"
          mkdir -p out
          cp "$d"/bundle/nsis/*-setup.exe "out/$p-setup.exe"
          cp "$d"/bundle/msi/*.msi "out/$p.msi"
          7z a -tzip "out/$p.zip" "./$d/roster-app.exe" > /dev/null
          if [ -f LICENSE ]; then 7z a -tzip "out/$p.zip" ./LICENSE > /dev/null; fi
          if [ -f THIRD-PARTY-NOTICES ]; then 7z a -tzip "out/$p.zip" ./THIRD-PARTY-NOTICES > /dev/null; fi
      - name: Collect (Linux)
        if: runner.os == 'Linux'
        run: |
          d="${{ matrix.target_dir }}"; p="roster-app-$VERSION-${{ matrix.name }}"
          mkdir -p out
          cp "$d"/bundle/appimage/*.AppImage "out/$p.AppImage"
          cp "$d"/bundle/deb/*.deb "out/$p.deb"
          cp "$d/roster-app" out/roster-app; [ -f LICENSE ] && cp LICENSE out/LICENSE
          [ -f THIRD-PARTY-NOTICES ] && cp THIRD-PARTY-NOTICES out/THIRD-PARTY-NOTICES
          tar -czf "out/$p.tar.gz" -C out roster-app $( [ -f LICENSE ] && echo LICENSE ) \
            $( [ -f THIRD-PARTY-NOTICES ] && echo THIRD-PARTY-NOTICES )
          rm -f out/roster-app out/LICENSE out/THIRD-PARTY-NOTICES
      - name: Collect (macOS)
        if: runner.os == 'macOS'
        run: |
          d="${{ matrix.target_dir }}"; p="roster-app-$VERSION-macos"
          mkdir -p out
          cp "$d"/bundle/dmg/*.dmg "out/$p-universal.dmg"
          mkdir -p pack && cp -R "$d/bundle/macos/Roster.app" pack/; [ -f LICENSE ] && cp LICENSE pack/
          [ -f THIRD-PARTY-NOTICES ] && cp THIRD-PARTY-NOTICES pack/
          tar -czf "out/$p.tar.gz" -C pack .
      # The app binaries carry ported third-party code (THIRD-PARTY-NOTICES): its notice ships next to LICENSE.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Archives carry THIRD-PARTY-NOTICES
        run: |
          shopt -s nullglob
          python -I scripts/check-release-notices.py out/*.zip out/*.tar.gz
      # The installers carry both too (bundle.resources in tauri.conf.json): unpack each and look.
      - name: Installers carry LICENSE and THIRD-PARTY-NOTICES (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = "roster-app-$env:VERSION-${{ matrix.name }}"
          7z x -y -ounpacked/nsis "out/$p-setup.exe" | Out-Null
          if ($LASTEXITCODE) { throw "7z couldn't unpack $p-setup.exe" }
          $msi = Start-Process msiexec.exe -Wait -PassThru -ArgumentList "/a `"$PWD\out\$p.msi`" /qn TARGETDIR=`"$PWD\unpacked\msi`""
          if ($msi.ExitCode) { throw "msiexec /a $p.msi failed: $($msi.ExitCode)" }
          python -I scripts/check-release-notices.py unpacked/nsis unpacked/msi
      - name: Installers carry LICENSE and THIRD-PARTY-NOTICES (Linux)
        if: runner.os == 'Linux'
        run: |
          p="roster-app-$VERSION-${{ matrix.name }}"
          dpkg-deb -x "out/$p.deb" unpacked/deb
          mkdir -p unpacked/appimage && chmod +x "out/$p.AppImage"
          (cd unpacked/appimage && "../../out/$p.AppImage" --appimage-extract > /dev/null)
          python -I scripts/check-release-notices.py unpacked/deb unpacked/appimage
      - name: Installers carry LICENSE and THIRD-PARTY-NOTICES (macOS)
        if: runner.os == 'macOS'
        run: |
          p="roster-app-$VERSION-macos"
          mkdir -p unpacked/dmg
          hdiutil attach -nobrowse -readonly -mountpoint unpacked/dmg "out/$p-universal.dmg" > /dev/null
          s=0
          python -I scripts/check-release-notices.py unpacked/dmg "${{ matrix.target_dir }}/bundle/macos/Roster.app" || s=$?
          hdiutil detach unpacked/dmg > /dev/null
          exit $s
      - run: ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: release-app-${{ matrix.name }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

  # The docs as one PDF (ticket 46, ADR 0008): every :help page, printed by headless Chromium from the
  # same pages the website shows. The website itself deploys from main (docs.yml).
  docs:
    name: Docs PDF
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: roster-docs PDF
        working-directory: app
        run: npm run docs -- --out ../docs-site --pdf "../out/roster-docs-$VERSION.pdf"
      - run: ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: release-docs
          path: out/*
          if-no-files-found: error
          retention-days: 14

  checksums:
    name: SHA256SUMS
    needs: [version, cli, app, docs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: out
      - name: SHA256SUMS
        working-directory: out
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          { echo '| File | Size |'; echo '|---|---|'
            for f in *; do echo "| \`$f\` | $(du -h -- "$f" | cut -f1) |"; done; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-all
          path: out/*
          retention-days: 14

  release:
    name: Draft Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job writes: it creates the draft Release and uploads its files
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs/news.md
            scripts/news_section.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: release-all
          path: out
      # The notes start with this version's section of docs/news.md (what's new, by area), then how
      # to install; GitHub's list of merged pull requests follows.
      - name: What's new
        run: python3 -I scripts/news_section.py "$VERSION" --repo "$GITHUB_REPOSITORY" > notes.md
      - name: Install notes
        run: |
          cat >> notes.md <<EOF

          ## Install

          **The app:** Windows \`roster-app-$VERSION-windows-x64-setup.exe\` (or the \`.msi\`, or the portable \`.zip\`);
          Linux \`.AppImage\` or \`.deb\` (or the \`.tar.gz\` with the bare binary); macOS \`roster-app-$VERSION-macos-universal.dmg\`.
          The app needs the roster CLI (\`roster serve\`) on the same machine, or in WSL on Windows.

          **The CLI:** unpack \`roster-cli-$VERSION.tar.gz\` and run \`./install.sh\`, or \`uv tool install roster-$VERSION-py3-none-any.whl\`
          then \`roster man --install\`. Either way \`man roster\` works afterwards; \`roster.1\` is the page on its own, for packagers.

          **The docs:** \`roster-docs-$VERSION.pdf\` is every \`:help\` page in one document; they're online at https://2styx2.github.io/roster/.

          These builds aren't code-signed yet: Windows SmartScreen asks "More info → Run anyway", and macOS needs
          right-click → Open the first time. Check downloads against \`SHA256SUMS\` (\`sha256sum -c SHA256SUMS --ignore-missing\`).
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: roster ${{ github.ref_name }}
          body_path: notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: out/*
