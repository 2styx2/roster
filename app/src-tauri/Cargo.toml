[package]
name = "roster-app"
version = "0.6.0"
description = "Keyboard-first terminal for the hosts in a roster Inventory"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
name = "roster_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
roster-core = { path = "../../crates/roster-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Copy and paste in the terminal: WebView2 only lets the page read the clipboard through this.
tauri-plugin-clipboard-manager = "2.5.0"

# Turning off WebView2's browser shortcuts (src/lib.rs); same versions tauri itself uses.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = "0.62"
