[workspace]
resolver = "3"
members = ["app/src-tauri", "crates/roster-core"]
# `cargo test` in WSL builds only the Tauri-free core (src-tauri needs webkit2gtk there).
default-members = ["crates/roster-core"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Lua is built optimised in debug and test builds too: unoptimised, a Plugin ran about six times
# slower than in the app, so the Plugin tests needed a scaled budget. Now they use the app's.
[profile.dev.package.mlua-sys]
opt-level = 3

[profile.dev.package.mlua]
opt-level = 3
